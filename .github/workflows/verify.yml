name: Verify static site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run publish:root
      - name: Confirm published files match source
        run: test -z "$(git status --porcelain -- index.html assets icon.svg model.worker.js)"
